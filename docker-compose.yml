services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itfreesource-academy-book-store
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=itfreesource-academy-super-secret-key-2026
    restart: unless-stopped
